version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: escalafy-postgres
    environment:
      POSTGRES_USER: escalafy_user
      POSTGRES_PASSWORD: escalafy_password
      POSTGRES_DB: escalafy_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escalafy_user -d escalafy_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
